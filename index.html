<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>崩坏：星穹铁道 月历</title><style>:root{
  --bg:#0d0e11; --fg:#eceef2; --muted:#9aa1ad; --faint:#6e7581;
  --wrap:transparent; --bd:rgba(255,255,255,.11); --divider:rgba(255,255,255,.09);
  --pill:transparent; --pill-fg:#eceef2; --link:#8aa8ff;
  --accent:#f5c451; --accent-fg:#0d0e11; --shadow:rgba(0,0,0,.5);
  --code-bg:rgba(255,255,255,.07); --code-fg:#9db8f0;
}
[data-theme="light"]{
  --bg:#faf9f7; --fg:#16181d; --muted:#5f6673; --faint:#8e94a1;
  --wrap:transparent; --bd:rgba(20,24,32,.13); --divider:rgba(20,24,32,.11);
  --pill:transparent; --pill-fg:#16181d; --link:#2b4fa8;
  --accent:#a8752a; --accent-fg:#ffffff; --shadow:rgba(20,30,60,.10);
  --code-bg:rgba(20,24,32,.055); --code-fg:#2b4fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--fg);
font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;padding:48px 32px;
transition:background .18s,color .18s}
.wrap{width:100%;max-width:520px}
h1{font-size:30px;font-weight:800;letter-spacing:-.022em;line-height:1.2;margin-bottom:10px}
.sub{color:var(--muted);font-size:13px;line-height:1.85;margin-bottom:30px;letter-spacing:.012em}
a.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;
background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:15px;
letter-spacing:.01em;padding:15px 20px;border-radius:3px;text-decoration:none;
margin-bottom:26px;transition:filter .15s,transform .12s}
a.btn::after{content:"→";font-size:17px;line-height:1;font-weight:700}
a.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.hint{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.2em;
margin-bottom:11px;text-transform:uppercase}
ul{list-style:none;display:flex;flex-wrap:wrap;gap:7px}
li a{display:inline-block;background:var(--pill);border:1px solid var(--bd);border-radius:2px;
padding:6px 13px;color:var(--pill-fg);text-decoration:none;font-size:12.5px;
font-variant-numeric:tabular-nums;letter-spacing:.04em;
transition:border-color .15s,color .15s,background .15s}
li a:hover{border-color:var(--link);color:var(--link)}
.foot{margin-top:28px;padding-top:15px;border-top:1px solid var(--divider);
color:var(--faint);font-size:11.5px;line-height:1.95;letter-spacing:.012em}
.repo{margin-top:20px}
.repo a{display:inline-flex;align-items:center;gap:7px;color:var(--faint);text-decoration:none;
font-size:11.5px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid transparent;
padding-bottom:1px;transition:color .15s,border-color .15s}
.repo a:hover{color:var(--fg);border-bottom-color:var(--bd)}
.repo svg{flex:0 0 auto;opacity:.8}
.theme-toggle{position:fixed;top:20px;right:22px;z-index:9999;display:inline-flex;
align-items:center;gap:7px;background:transparent;color:var(--muted);border:1px solid var(--bd);
border-radius:999px;padding:7px 13px;font-family:inherit;font-size:11.5px;font-weight:600;
letter-spacing:.06em;line-height:1;cursor:pointer;transition:color .16s,border-color .16s}
.theme-toggle:hover{color:var(--fg);border-color:var(--link)}
.theme-toggle svg{display:block;flex:0 0 auto}
.tt-moon{display:none}
[data-theme="light"] .tt-sun{display:none}
[data-theme="light"] .tt-moon{display:block}
.tt-lbl::after{content:"浅色"}
[data-theme="light"] .tt-lbl::after{content:"深色"}
</style>
<script>(function(){var K='hsr-theme',s=null;try{s=localStorage.getItem(K)}catch(e){}var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.setAttribute('data-theme',s||(m?'light':'dark'));})();</script></head>
<body>
<button id="themeBtn" class="theme-toggle" type="button" aria-label="切换浅色 / 深色模式" title="切换浅色 / 深色模式"><svg class="tt-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg><svg class="tt-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg><span class="tt-lbl"></span></button>
<div class="wrap">
  <h1>崩坏：星穹铁道 · 月历</h1>
  <div class="sub">每月一份，每周六刷新。红线标的是当前真实时刻，条目可点击跳转官方来源。</div>
  <a class="btn" id="go" href="2026/11/calendar.html">打开最新月历</a>
  <div class="hint">全部月份</div>
  <ul><li><a href="2026/11/calendar.html">2026/11</a></li><li><a href="2026/10/calendar.html">2026/10</a></li></ul>
  <div class="foot" id="foot">正在跳转到本月月历…</div>
  <div class="repo">
    <a href="https://github.com/Ayin6667/hsr-calendar" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      在 GitHub 查看数据与脚本 ↗
    </a>
  </div>
</div>
<script>
(function () {
  var MONTHS = ["2026/11", "2026/10"];
  var LATEST = "2026/11";
  var go = document.getElementById('go');
  var foot = document.getElementById('foot');
  function ym() {
    var d = new Date(Date.now() + 8 * 3600 * 1000);
    var m = d.getUTCMonth() + 1;
    return d.getUTCFullYear() + '/' + (m < 10 ? '0' + m : '' + m);
  }
  if (MONTHS.indexOf(LATEST) < 0) { MONTHS.unshift(LATEST); }
  var want = ym();
  var target = (MONTHS.indexOf(want) >= 0 ? want : LATEST) + '/calendar.html';
  go.setAttribute('href', target);
  foot.textContent = '目标月份 ' + (MONTHS.indexOf(want) >= 0 ? want : LATEST + '（当月尚未生成）') + '，正在打开…';
  fetch(target, { method: 'HEAD' }).then(function (r) {
    if (r.ok) { location.replace(target); }
    else { foot.textContent = '未能自动打开，请从上方列表选择。'; }
  }).catch(function () { foot.textContent = '未能自动打开，请从上方列表选择。'; });
})();
</script>
<script>(function(){var K='hsr-theme',r=document.documentElement,btn=document.getElementById('themeBtn');function cur(){return r.getAttribute('data-theme')==='light'?'light':'dark';}if(btn){btn.addEventListener('click',function(){var n=cur()==='light'?'dark':'light';r.setAttribute('data-theme',n);try{localStorage.setItem(K,n)}catch(e){}});}if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: light)');var h=function(e){var s=null;try{s=localStorage.getItem(K)}catch(x){}if(!s){r.setAttribute('data-theme',e.matches?'light':'dark')}};if(mq.addEventListener){mq.addEventListener('change',h)}else if(mq.addListener){mq.addListener(h)}}})();</script>
</body></html>
